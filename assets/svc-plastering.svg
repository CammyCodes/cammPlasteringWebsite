<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pinkPlaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb6a3"/>
      <stop offset="50%" stop-color="#cc9f8b"/>
      <stop offset="100%" stop-color="#b68875"/>
    </linearGradient>
    <linearGradient id="trowelFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pinkPlaster)"/>
  
  <!-- Smooth plaster waves -->
  <path d="M -50,200 Q 250,150 550,220 T 850,180" stroke="#eedcd3" stroke-width="24" opacity="0.6" stroke-linecap="round"/>
  <path d="M 0,380 Q 300,320 600,400 T 900,350" stroke="#f4e6df" stroke-width="30" opacity="0.5" stroke-linecap="round"/>

  <!-- Trowel Close Up -->
  <g transform="translate(180, 100) rotate(-12)">
    <rect x="100" y="100" width="340" height="180" rx="6" fill="url(#trowelFace)" stroke="#64748b" stroke-width="3"/>
    <!-- Blade bevel edge reflection -->
    <line x1="100" y1="278" x2="440" y2="278" stroke="#ffffff" stroke-width="6"/>
    <!-- Trowel Spine -->
    <rect x="140" y="175" width="260" height="30" rx="4" fill="#334155"/>
    <!-- Tang -->
    <path d="M 260,175 L 260,110 L 290,110 L 290,175 Z" fill="#475569"/>
    <!-- Handle -->
    <rect x="245" y="40" width="60" height="80" rx="12" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  </g>
</svg>