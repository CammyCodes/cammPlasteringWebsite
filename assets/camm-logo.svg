<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <defs>
    <!-- Exact palette matched from original logo -->
    <linearGradient id="darkLeftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102d54"/>
      <stop offset="100%" stop-color="#0b1f3c"/>
    </linearGradient>
    <linearGradient id="lightRightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a477f"/>
      <stop offset="100%" stop-color="#133663"/>
    </linearGradient>
  </defs>

  <!-- 3D Architectural Pillars with Central Ridge -->
  <!-- Pillar 1 (Left - Shortest) -->
  <polygon points="16,84 38,72 38,142 16,134" fill="url(#darkLeftFace)"/>
  <polygon points="38,72 54,80 54,126 38,142" fill="url(#lightRightFace)"/>

  <!-- Pillar 2 (Middle - Medium) -->
  <polygon points="58,48 94,30 94,154 58,144" fill="url(#darkLeftFace)"/>
  <polygon points="94,30 116,40 116,134 94,154" fill="url(#lightRightFace)"/>

  <!-- Pillar 3 (Right - Tallest) -->
  <polygon points="120,16 164,-6 164,168 120,152" fill="url(#darkLeftFace)"/>
  <polygon points="164,-6 196,4 196,140 164,168" fill="url(#lightRightFace)"/>

  <!-- Logo Typography -->
  <g font-family="'Archivo', 'Montserrat', 'Helvetica Neue', sans-serif" fill="#122e54">
    <text x="218" y="56" font-size="52" font-weight="900" letter-spacing="0.5">CAMM</text>
    <text x="218" y="90" font-size="25" font-weight="600" letter-spacing="2.2">PLASTERING</text>
    <text x="218" y="120" font-size="25" font-weight="600" letter-spacing="2.2">CONTRACTORS</text>
    <text x="218" y="150" font-size="25" font-weight="600" letter-spacing="2.2">LTD</text>
  </g>
</svg>